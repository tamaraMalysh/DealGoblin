[project]
name = "dealgoblin"
version = "0.1.0"
description = "Async Telegram flea-market finder"
requires-python = ">=3.13"
dependencies = [
    "telethon>=1.37",
    "aiogram>=3.16",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.14.2",
    "pymorphy3>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "bandit>=1.8",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dealgoblin"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
